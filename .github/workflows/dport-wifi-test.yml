name: DPort Wi-Fi Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dport-wifi-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout DPort 6.9.1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v6.9.1

      - name: Verify base version
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath 'src\dport_version.py' -Raw
          if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']6\.9\.1["'']') {
            throw 'Wi-Fi test must be based on DPort 6.9.1.'
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) {
            throw 'Missing MOENV_API_KEY secret.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'moenv_api_key.txt'),
            $env:MOENV_API_KEY.Trim(),
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2

          $pm3 = (python -c "from importlib.metadata import version; print(version('pymobiledevice3'))").Trim()
          if ($pm3 -ne '11.19.4') {
            throw "Expected pymobiledevice3 11.19.4, got [$pm3]"
          }

      - name: Disable production auto-updater for Wi-Fi test
        shell: pwsh
        run: |
          $path = 'src\main.py'
          $src = Get-Content -LiteralPath $path -Raw

          $src = [regex]::Replace(
            $src,
            '(?m)^import dport_release_updater\r?\n',
            ''
          )

          $src = [regex]::Replace(
            $src,
            '(?m)^from dport_release_updater import bootstrap_dport_updater\r?\nbootstrap_dport_updater\(\)\r?\n',
            ''
          )

          $src = [regex]::Replace(
            $src,
            '(?ms)^try:\r?\n\s+from dport_release_updater import start_background_update_check\r?\n\s+start_background_update_check\(\)\r?\nexcept Exception as exc:\r?\n\s+logging\.getLogger\("DPort"\)\.debug\("pymobiledevice3 updater startup skipped: %s", exc\)\r?\n',
            ''
          )

          Set-Content -LiteralPath $path -Value $src -Encoding utf8
          python -m py_compile src/main.py

      - name: Validate Wi-Fi support
        shell: pwsh
        run: |
          $main = Get-Content -LiteralPath 'src\main.py' -Raw

          foreach ($required in @(
            'get_wifi_with_retry',
            'get_mobdev2_lockdowns',
            'create_using_tcp',
            'CoreDeviceTunnelProxy',
            'wifihost'
          )) {
            if ($main -notlike "*$required*") {
              throw "Missing Wi-Fi support: $required"
            }
          }

      - name: Build Wi-Fi test executable
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }

          $args = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--windowed',
            '--name','DPort-WiFi-Test-6.9.1',
            '--collect-all','pymobiledevice3',
            '--collect-all','pytun_pmd3',
            '--collect-all','pyimg4',
            '--collect-all','inquirer3',
            '--copy-metadata','pymobiledevice3',
            '--copy-metadata','pyimg4',
            '--copy-metadata','readchar',
            '--hidden-import','pymobiledevice3.remote.userspace_tunnel',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.dvt_provider',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.location_simulation',
            '--hidden-import','pymobiledevice3.usbmux',
            '--add-data','src/templates;templates',
            '--add-data','moenv_api_key.txt;.',
            'src/main.py'
          )

          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed.'
          }

          if (-not (Test-Path 'dist\DPort-WiFi-Test-6.9.1.exe')) {
            throw 'DPort-WiFi-Test-6.9.1.exe was not produced.'
          }

      - name: Verify GUI executable
        shell: pwsh
        run: |
          python -m pip install pefile
          python -c "import pefile,sys; p=pefile.PE(sys.argv[1]); sys.exit(0 if p.OPTIONAL_HEADER.Subsystem==2 else 1)" 'dist\DPort-WiFi-Test-6.9.1.exe'
          if ($LASTEXITCODE -ne 0) {
            throw 'The Wi-Fi test EXE is not a Windows GUI executable.'
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          (Get-FileHash 'dist\DPort-WiFi-Test-6.9.1.exe' -Algorithm SHA256).Hash.ToLower() |
            Set-Content 'dist\DPort-WiFi-Test-6.9.1.exe.sha256' -Encoding ascii

      - name: Package ZIP
        shell: pwsh
        run: |
          $stage = 'DPort-WiFi-Test-6.9.1'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item 'dist\DPort-WiFi-Test-6.9.1.exe' $stage -Force
          Copy-Item 'dist\DPort-WiFi-Test-6.9.1.exe.sha256' $stage -Force

          @"
DPort Wi-Fi Test 6.9.1

Base source: DPort v6.9.1
pymobiledevice3: 11.19.4
Wi-Fi discovery: Apple mobdev2 / Bonjour
Production DPort auto-update: disabled
This is a test build, not a production release.
"@ | Set-Content (Join-Path $stage 'README-WiFi-Test.txt') -Encoding utf8

          Compress-Archive -Path "$stage\*" -DestinationPath 'DPort-WiFi-Test-6.9.1.zip' -Force

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DPort-WiFi-Test-6.9.1
          path: |
            DPort-WiFi-Test-6.9.1.zip
            dist/DPort-WiFi-Test-6.9.1.exe
            dist/DPort-WiFi-Test-6.9.1.exe.sha256
          retention-days: 14
