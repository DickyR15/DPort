name: DPort Wi-Fi Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/wifi-test'

permissions:
  contents: read
  actions: write

concurrency:
  group: dport-wifi-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Wi-Fi source
        uses: actions/checkout@v4
        with:
          ref: feature/wifi-test
          fetch-depth: 1

      - name: Extract production source for Wi-Fi diagnostics
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'dport-source-debug'
          if (Test-Path $d) { Remove-Item $d -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $d -Force
          $main = Get-ChildItem $d -Filter main.py -Recurse | Select-Object -First 1
          if (-not $main) { throw 'main.py not found' }
          Copy-Item $main.FullName 'wifi-debug-main.py' -Force
          $map = Get-ChildItem $d -Filter map.html -Recurse | Select-Object -First 1
          if (-not $map) { throw 'map.html not found' }
          Copy-Item $map.FullName 'wifi-debug-map.html' -Force
          Compress-Archive -Path 'wifi-debug-main.py','wifi-debug-map.html' -DestinationPath 'wifi-debug-source.zip' -Force

      - name: Upload production source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: DPort-WiFi-Source-Debug
          path: wifi-debug-source.zip
          retention-days: 2

      - name: Validate Wi-Fi patch syntax
        shell: pwsh
        run: python -m py_compile scripts\apply_wifi_test.py

      - name: Build DPort Wi-Fi test ZIP
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_wifi_test.ps1

      - name: Upload direct package (no nested ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: DPort-WiFi-Test-6.9.29
          path: DPort-WiFi-Test-6.9.29/*
          retention-days: 14

      - name: Delete failed Wi-Fi run
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          echo "Deleting failed Wi-Fi run $RUN_ID"
          gh api --method DELETE "repos/$REPO/actions/runs/$RUN_ID" || true
