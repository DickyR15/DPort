name: DPort Release (current source)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dport-release-current
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath 'src/dport_version.py' -Raw
          if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'DPORT_VERSION not found.' }
          $v = $Matches[1]
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid DPort version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw 'Missing GitHub Actions secret MOENV_API_KEY.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'moenv_api_key.txt'), $env:MOENV_API_KEY.Trim(), (New-Object Text.UTF8Encoding($false)))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2
          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          $line = Get-Content requirements-build.txt | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1
          $expected = $line.Trim().Substring('pymobiledevice3=='.Length).Trim()
          if ($pm3 -ne $expected) { throw "Expected pymobiledevice3 $expected, got $pm3" }
          Write-Host "Using pymobiledevice3 $pm3"

      - name: Apply DPort final fixes
        shell: pwsh
        run: |
          python scripts/fix_device_refresh.py
          python scripts/final_ui_polish.py
          python scripts/fix_startup_render.py

      - name: Generate version metadata
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $p = $v.Split('.') | ForEach-Object { [int]$_ }
          @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($($p[0]),$($p[1]),$($p[2]),0),",
            "    prodvers=($($p[0]),$($p[1]),$($p[2]),0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','$v'),",
            "    StringStruct('InternalName','DPort-$v'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-$v.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','$v'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine | Set-Content version_info.generated.txt -Encoding utf8

      - name: Prepare build icon
        shell: pwsh
        run: |
          if (Test-Path 'DPort-6.9.0.ico') { exit 0 }
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort icon is missing and source ZIP is unavailable.' }
          $tmp = Join-Path $env:RUNNER_TEMP 'icon-source'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $tmp -Force
          $root = Get-ChildItem -LiteralPath $tmp -Directory | Where-Object { $_.Name -like 'DPort-*' } | Select-Object -First 1
          if (-not $root) { throw 'Source ZIP root not found.' }
          Copy-Item -LiteralPath (Join-Path $root.FullName 'DPort-6.9.0.ico') -Destination 'DPort-6.9.0.ico' -Force

      - name: Syntax audit
        shell: pwsh
        run: |
          python -m compileall -q src scripts
          python -m py_compile src/main.py src/dport_version.py src/dport_release_updater.py src/dport_updater_helper.py
          Write-Host 'Python syntax audit passed.'

      - name: Validate version-only updater
        shell: pwsh
        run: |
          $u = Get-Content -LiteralPath 'src/dport_release_updater.py' -Raw
          foreach ($token in @('_current_exe_sha256','_release_exe_sha256','current_sha256','latest_sha256','same_version_build','_get_update_candidate_version_only')) { if ($u.Contains($token)) { throw "Forbidden same-version SHA updater token remains: $token" } }
          if ($u -notmatch 'def _get_update_candidate\(current:\s*str\)') { throw 'Version-only updater signature is missing.' }

      - name: Build updater
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          python -m PyInstaller --noconfirm --clean --onefile --name DPortUpdater --collect-all certifi --hidden-import importlib.metadata src/dport_updater_helper.py
          New-Item -ItemType Directory -Force -Path build/updater | Out-Null
          Copy-Item dist/DPortUpdater.exe build/updater/DPortUpdater.exe -Force

      - name: Build DPort
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          python -m PyInstaller --noconfirm --clean --onefile --name "DPort-$v" --icon DPort-6.9.0.ico --collect-all pymobiledevice3 --collect-all pytun_pmd3 --collect-all pyimg4 --collect-all inquirer3 --copy-metadata pymobiledevice3 --copy-metadata pyimg4 --copy-metadata readchar --hidden-import pymobiledevice3.remote.userspace_tunnel --hidden-import pymobiledevice3.services.dvt.instruments.dvt_provider --hidden-import pymobiledevice3.services.dvt.instruments.location_simulation --hidden-import pymobiledevice3.usbmux --hidden-import dport_release_updater --hidden-import dport_version --add-data 'src/templates;templates' --add-data 'moenv_api_key.txt;.' --add-binary 'build/updater/DPortUpdater.exe;dport_updater' --version-file version_info.generated.txt src/main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small.' }
          pyi-archive_viewer $exe | Out-File "dist/DPort-$v.archive.txt" -Encoding utf8
          $archive = Get-Content "dist/DPort-$v.archive.txt" -Raw
          foreach ($name in @('pymobiledevice3','pytun_pmd3','pyimg4')) { if ($archive -notmatch $name) { throw "EXE missing $name" } }

      - name: Smoke test
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $p = Start-Process -FilePath "dist\DPort-$v.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "DPort exited with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          (Get-FileHash "dist/DPort-$v.exe" -Algorithm SHA256).Hash.ToLower() | Set-Content "dist/DPort-$v.exe.sha256" -Encoding ascii

      - name: Sync source package
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'dport-source-package'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $root = Join-Path $tmp 'DPort-6.9.0'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'src') | Out-Null
          Copy-Item -Path 'src\*' -Destination (Join-Path $root 'src') -Recurse -Force
          foreach ($item in @('requirements-build.txt','build_final_live.bat','python_runtime.txt','DPort_CHANGELOG.txt','version_info.txt','DPort-6.9.0.ico')) { if (Test-Path $item) { Copy-Item -LiteralPath $item -Destination $root -Force } }
          $zip = Join-Path $env:RUNNER_TEMP 'DPort-source-6.9.0.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal -Force
          Copy-Item $zip 'DPort-source-6.9.0.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DPort-source-6.9.0.zip
          if (-not (git diff --cached --quiet)) { git commit -m 'chore: sync DPort source package [skip ci]'; git push origin HEAD:main }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-${{ steps.version.outputs.version }}-windows
          path: |
            dist/DPort-${{ steps.version.outputs.version }}.exe
            dist/DPort-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $exe = "dist/DPort-$v.exe"
          $sha = "dist/DPort-$v.exe.sha256"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sha --repo "${{ github.repository }}" --clobber
            gh release edit $tag --repo "${{ github.repository }}" --title "DPort v$v" --latest
          } else {
            gh release create $tag $exe $sha --repo "${{ github.repository }}" --title "DPort v$v" --latest --generate-notes --target "${{ github.sha }}"
          }
          Write-Host "Published DPort v$v"
