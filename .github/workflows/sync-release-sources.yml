name: Sync Existing Release Sources

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download confirmed release-build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36553717448
          name: DPort-repaired-6.9.0-6.9.1
          path: repair-artifact
          github-token: ${{ github.token }}

      - name: Synchronize v6.9.0 and v6.9.1 tags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin --tags --force
          foreach ($v in @('6.9.0','6.9.1')) {
            $tag = "v$v"
            $srcZip = Join-Path $PWD "repair-artifact\repair\DPort-source-$v.zip"
            if (-not (Test-Path $srcZip)) { throw "Missing source package for ${v}: $srcZip" }
            $extract = Join-Path $env:RUNNER_TEMP "source-$v"
            $work = Join-Path $env:RUNNER_TEMP "tag-$v-work"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            if (Test-Path $work) { Remove-Item $work -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $srcZip -DestinationPath $extract -Force
            $root = Get-ChildItem $extract -Directory | Select-Object -First 1
            if (-not $root) { throw "Source root not found for $v." }
            git worktree add --detach $work $tag
            try {
              git -C $work config core.autocrlf false
              git -C $work config core.eol lf
              Copy-Item (Join-Path $root.FullName '*') $work -Recurse -Force
              $legacyZip = Join-Path $work 'DPort-source-6.9.0.zip'
              if (Test-Path $legacyZip) { Remove-Item $legacyZip -Force }
              Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\build-release.yml') (Join-Path $work '.github\workflows\build-release.yml') -Force
              Set-Location $work
              git config user.name 'Dicky'
              git config user.email '125186855+DickyR15@users.noreply.github.com'
              git add -A
              # Verify the index contains the exact bytes from the source package.
              foreach ($path in @(
                "src\main.py",
                "src\dport_release_updater.py",
                "src\dport_updater_helper.py",
                "src\templates\map.html",
                "requirements-build.txt",
                "src\dport_version.py"
              )) {
                $sourcePath = Join-Path $root.FullName $path
                $expected = (git hash-object $sourcePath).Trim()
                $actual = (git rev-parse "HEAD:$($path.Replace('\','/'))").Trim()
                if ($expected -ne $actual) { throw "$tag source mismatch for $path. expected=$expected actual=$actual" }
              }
              git commit -m "chore: sync $tag with released build source"
              git push origin "HEAD:refs/tags/$tag" --force
              if ($LASTEXITCODE -ne 0) { throw "Failed to push $tag." }
            } finally {
              Set-Location $env:GITHUB_WORKSPACE
              git worktree remove $work --force
              if (Test-Path $extract) { Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: Verify source tags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin --tags --force
          foreach ($v in @('6.9.0','6.9.1')) {
            $tag = "v$v"
            $ver = (git show "$tag`:src\dport_version.py").Trim()
            if ($ver -ne "DPORT_VERSION=\"$v\"") { throw "$tag version mismatch: $ver" }
            foreach ($path in @('src\main.py','src\dport_release_updater.py','src\dport_updater_helper.py','src\templates\map.html','requirements-build.txt','.github\workflows\build-release.yml')) {
              git cat-file -e "$tag`:$path"
              if ($LASTEXITCODE -ne 0) { throw "$tag missing $path" }
            }
            if (git ls-tree -r --name-only $tag | Select-String -SimpleMatch 'DPort-source-6.9.0.zip') { throw "$tag still contains legacy source ZIP" }
          }
          Write-Host 'v6.9.0 and v6.9.1 tags are synchronized to the released build source.'
