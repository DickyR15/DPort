name: DPort Wi-Fi Failed Run Cleanup

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed Wi-Fi workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning failed DPort Wi-Fi workflow runs..."

          gh api --paginate             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/repos/$REPO/actions/runs?per_page=100"             --jq '.workflow_runs[]
              | select(.conclusion == "failure")
              | select(.name | startswith("DPort Wi-Fi"))
              | .id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Deleting failed Wi-Fi run: $run_id"
            gh api --method DELETE               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "/repos/$REPO/actions/runs/$run_id"
          done

          echo "Failed Wi-Fi workflow cleanup complete."
