name: DPort Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DPort version (manual build, e.g. 6.9.0)'
        required: true
        default: '6.9.0'

permissions:
  contents: write

concurrency:
  group: dport-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DPort source
        shell: pwsh
        run: |
          git status --short
          git ls-tree -r --name-only HEAD | Select-String -SimpleMatch 'DPort-source-6.9.0.zip'
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) {
            Write-Host 'Working tree does not contain the ZIP; restoring directly from HEAD blob...'
            git show HEAD:DPort-source-6.9.0.zip | Set-Content -AsByteStream DPort-source-6.9.0.zip
          }
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort-source-6.9.0.zip is missing from both working tree and HEAD.' }

          $zip = Get-Item 'DPort-source-6.9.0.zip'
          Write-Host "Source ZIP size: $($zip.Length) bytes"
          $tmp = Join-Path $env:RUNNER_TEMP 'dport-source'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $tmp -Force

          $sourceRoot = Join-Path $tmp 'DPort-6.9.0'
          if (-not (Test-Path $sourceRoot)) {
            throw "Unexpected source ZIP layout. Expected $sourceRoot"
          }

          $copy = @('DPort-6.9.0.ico','requirements-build.txt','build_final_live.bat','python_runtime.txt','DPort_CHANGELOG.txt','version_info.txt')
          foreach ($item in $copy) {
            $p = Join-Path $sourceRoot $item
            if (Test-Path $p) { Copy-Item -LiteralPath $p -Destination . -Force }
          }

          # Keep the known-good dependency baseline from 936fd96: build with pymobiledevice3 11.19.1.
          $srcReq = Join-Path $sourceRoot 'requirements-build.txt'
          if (-not (Test-Path $srcReq)) { throw "Source requirements file missing: $srcReq" }
          $srcReqText = Get-Content -LiteralPath $srcReq -Raw
          $srcReqText = $srcReqText -replace 'pymobiledevice3==11\.18\.0', 'pymobiledevice3==11.19.1'
          if ($srcReqText -notmatch 'pymobiledevice3==11\.19\.1') { throw 'Failed to pin pymobiledevice3 11.19.1 in restored source.' }
          Set-Content -LiteralPath $srcReq -Value $srcReqText -Encoding utf8

          $sourceSrc = Join-Path $sourceRoot 'src'
          if (Test-Path $sourceSrc) {
            if (Test-Path 'src') { Remove-Item 'src' -Recurse -Force }
            New-Item -ItemType Directory -Force -Path 'src' | Out-Null
            Copy-Item -Path (Join-Path $sourceSrc '*') -Destination 'src' -Recurse -Force
          }

          if (-not (Test-Path 'src/main.py')) {
            Write-Host 'Restored source tree:'
            Get-ChildItem -Recurse -Depth 3 $sourceRoot | Select-Object FullName
            throw 'Source restore failed: src/main.py is missing.'
          }

      - name: Inspect source version
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath 'src/dport_version.py' -Raw
          if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']([^"'']+)["'']') {
            throw 'DPORT_VERSION not found in restored source.'
          }
          $sourceVersion = $Matches[1]
          if ($sourceVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid DPort version: $sourceVersion"
          }
          Write-Host "Restored source DPort version: $sourceVersion"
      - name: Remove legacy version badge
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw
          $old = '<span class="dport-version-badge">6.9.0</span>'
          if ($html.Contains($old)) {
            $html = $html.Replace($old, '')
            Set-Content -LiteralPath $map -Value $html -Encoding utf8
            Write-Host 'Removed legacy 6.9.0 version badge from map.html.'
          } else {
            Write-Host 'No legacy 6.9.0 version badge present; continuing.'
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.version }}' -ne '') {
            $v = '${{ inputs.version }}'
          } else {
            $raw = Get-Content -LiteralPath 'src/dport_version.py' -Raw
            if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']([^"'']+)["'']') {
              throw 'DPORT_VERSION not found in source.'
            }
            $v = $Matches[1]
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid DPort version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Set-Content src/dport_version.py ('DPORT_VERSION="{0}"' -f $v) -Encoding utf8
          $parts = $v.Split('.') | ForEach-Object { [int]$_ }
          $vi = @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            "    prodvers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','$v'),",
            "    StringStruct('InternalName','DPort-$v'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-$v.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','$v'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine
          $vi | Set-Content version_info.generated.txt -Encoding utf8
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw 'Missing GitHub Actions secret MOENV_API_KEY.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'moenv_api_key.txt'), $env:MOENV_API_KEY.Trim(), (New-Object Text.UTF8Encoding($false)))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2
          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          $line = Get-Content requirements-build.txt | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1
          if (-not $line) { throw 'Could not determine pymobiledevice3 pin from requirements-build.txt' }
          $expected = $line.Trim().Substring('pymobiledevice3=='.Length).Trim()
          if ($pm3 -ne $expected) { throw "Expected pymobiledevice3 $expected, got $pm3" }

      - name: Remove same-version SHA auto-update
        shell: pwsh
        run: |
          python scripts/disable_same_version_sha_update.py

      - name: Fix device refresh state
        shell: pwsh
        run: |
          python scripts/fix_device_refresh.py

      - name: Final UI polish
        shell: pwsh
        run: |
          python scripts/final_ui_polish.py

      - name: Sync clean 6.9.0 source package
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'dport-source\DPort-6.9.0'
          if (-not (Test-Path $sourceRoot)) { throw "Restored source root missing: $sourceRoot" }

          $sourceSrc = Join-Path $sourceRoot 'src'
          if (Test-Path $sourceSrc) { Remove-Item $sourceSrc -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $sourceSrc | Out-Null
          Copy-Item -Path 'src\*' -Destination $sourceSrc -Recurse -Force

          $tmpZip = Join-Path $env:RUNNER_TEMP 'DPort-source-6.9.0.cleaned.zip'
          if (Test-Path $tmpZip) { Remove-Item $tmpZip -Force }

          Compress-Archive -Path $sourceRoot -DestinationPath $tmpZip -CompressionLevel Optimal -Force
          Copy-Item -LiteralPath $tmpZip -Destination 'DPort-source-6.9.0.zip' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DPort-source-6.9.0.zip
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: sync clean DPort 6.9.0 source package [skip ci]'
            git push origin HEAD:main
          } else {
            Write-Host 'Source package already matches the cleaned build source.'
          }

      - name: Full Python syntax audit
        shell: pwsh
        run: |
          python -m compileall -q src scripts
          Write-Host 'Full Python syntax audit passed for src/ and scripts.'
      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile src/main.py src/dport_version.py src/dport_release_updater.py src/dport_updater_helper.py
          $updater = Get-Content -LiteralPath 'src/dport_release_updater.py' -Raw
          foreach ($forbidden in @('_current_exe_sha256','_read_release_sha256','current_sha256','latest_sha256','same_version_build')) {
            if ($updater.Contains($forbidden)) { throw "Forbidden same-version SHA updater token remains: $forbidden" }
          }
          Write-Host 'Updater validation passed: version-only update detection.'

      - name: Validate final header layout
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw

          $required = @(
            'dport-hero',
            'dport-brand',
            'dport-ultra-gpx-slot',
            'dport-ultra-device-slot',
            'dport-hero-actions'
          )
          foreach ($name in $required) {
            if ($html -notmatch [regex]::Escape($name)) {
              throw "Required header selector missing: $name"
            }
          }

          if (([regex]::Matches($html, 'id="dport-header-final-v2"')).Count -ne 1) {
            throw 'Expected exactly one final DPort header style block.'
          }

          $legacyPatterns = @(
            'dport-top-header-final-v[0-9]+',
            'dport-top-header-layout-v[0-9]+',
            'dport-ultra-header-layout-v[0-9]+',
            'dport-ultra-header-notification-v[0-9]+',
            'dport-persistent-notification'
          )
          foreach ($pattern in $legacyPatterns) {
            if ($html -match $pattern) {
              throw "Legacy header layer remains in map.html: $pattern"
            }
          }

          if ($html -notmatch '.dport-hero-notifications{[^}]*display:none') {
            throw 'Header notification area is not fully removed.'
          }

                    if ($html -notmatch 'grid-template-columns:clamp\(300px,19vw,340px\) minmax\(600px,1fr\) clamp\(560px,31vw,680px\) 82px') {
            throw 'Final header does not contain the expected enlarged Brand / GPX / Device / Exit layout.'
          }

          if ($html -notmatch '#device\{[^}]*display:block!important[^}]*width:100%!important') {
            throw 'Device selector width rule is missing.'
          }

          Write-Host 'Header structural validation passed.'
          Write-Host 'Order: DPort -> GPX -> Device -> Refresh -> Connect -> Exit.'
          Write-Host 'Header notification is removed; status reminders remain in the left green status area.'

      - name: Build embedded updater
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          $args = @('--noconfirm','--clean','--onefile','--name','DPortUpdater','--collect-all','certifi','--hidden-import','importlib.metadata','src/dport_updater_helper.py')
          python -m PyInstaller @args
          New-Item -ItemType Directory -Force -Path build/updater | Out-Null
          Copy-Item dist/DPortUpdater.exe build/updater/DPortUpdater.exe -Force

      - name: Build DPort
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $pyargs = @(
            '--noconfirm','--clean','--onefile',
            '--name',("DPort-$v"),
            '--icon','DPort-6.9.0.ico',
            '--collect-all','pymobiledevice3',
            '--collect-all','pytun_pmd3',
            '--collect-all','pyimg4',
            '--collect-all','inquirer3',
            '--copy-metadata','pymobiledevice3',
            '--copy-metadata','pyimg4',
            '--copy-metadata','readchar',
            '--hidden-import','pymobiledevice3.remote.userspace_tunnel',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.dvt_provider',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.location_simulation',
            '--hidden-import','pymobiledevice3.usbmux',
            '--hidden-import','dport_release_updater',
            '--hidden-import','dport_version',
            '--add-data','src/templates;templates',
            '--add-data','moenv_api_key.txt;.',
            '--add-binary','build/updater/DPortUpdater.exe;dport_updater',
            '--version-file','version_info.generated.txt',
            'src/main.py'
          )
          python -m PyInstaller @pyargs

      - name: Verify built EXE
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Build output is unexpectedly small.' }

      - name: Audit packaged pymobiledevice3 content
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          $listing = "dist/DPort-$v.archive.txt"
          if (-not (Get-Command pyi-archive_viewer -ErrorAction SilentlyContinue)) {
            throw 'pyi-archive_viewer was not found after PyInstaller installation.'
          }
          pyi-archive_viewer $exe | Out-File -FilePath $listing -Encoding utf8
          $archive = Get-Content -LiteralPath $listing -Raw
          if ($archive -notmatch 'pymobiledevice3') { throw 'Packaged EXE does not contain pymobiledevice3 archive entries.' }
          if ($archive -notmatch 'pytun_pmd3') { throw 'Packaged EXE does not contain pytun_pmd3 archive entries.' }
          if ($archive -notmatch 'pyimg4') { throw 'Packaged EXE does not contain pyimg4 archive entries.' }
          Write-Host 'Packaged dependency audit passed.'

      - name: Simulate DPort updater 6.9.0 -> 6.9.1
        shell: pwsh
        run: |
          @'
          import importlib.util
          from pathlib import Path

          root = Path.cwd()
          mod_path = root / 'src' / 'dport_release_updater.py'
          spec = importlib.util.spec_from_file_location('dport_release_updater', mod_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          fake_release = {
              'draft': False,
              'prerelease': False,
              'tag_name': 'v6.9.1',
              'html_url': 'https://example.invalid/DPort/releases/tag/v6.9.1',
              'assets': [
                  {'name': 'DPort-6.9.1.exe', 'browser_download_url': 'https://example.invalid/DPort-6.9.1.exe'},
                  {'name': 'DPort-6.9.1.exe.sha256', 'browser_download_url': 'https://example.invalid/DPort-6.9.1.exe.sha256'},
              ],
          }
          mod._github_json = lambda _url: fake_release
          candidate = mod._get_update_candidate('6.9.0')
          assert candidate is not None, '6.9.0 should detect fake 6.9.1'
          assert candidate[0] == '6.9.1', candidate
          assert mod._get_update_candidate('6.9.1') is None, '6.9.1 must be up to date'
          print('Updater version logic simulation passed: 6.9.0 -> 6.9.1.')

          req = (root / 'requirements-build.txt').read_text(encoding='utf-8', errors='replace')
          assert 'pymobiledevice3==11.19.1' in req, req
          version_text = (root / 'src' / 'dport_version.py').read_text(encoding='utf-8')
          assert 'DPORT_VERSION="6.9.0"' in version_text, version_text
          assert (root / 'scripts' / 'finalize_pm3_update.py').exists()
          '@ | Set-Content audit_updater.py -Encoding utf8
          python audit_updater.py

      - name: Smoke-test built DPort executable
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = Join-Path $PWD "dist\DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "DPort exited during smoke test with code $($p.ExitCode)" }
            Write-Host 'DPort exited cleanly during smoke test.'
          } else {
            Stop-Process -Id $p.Id -Force
            Write-Host 'DPort remained running during smoke test; executable launch passed.'
          }
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Set-Content "dist/DPort-$v.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-${{ steps.version.outputs.version }}-windows
          path: |
            dist/DPort-${{ steps.version.outputs.version }}.exe
            dist/DPort-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $exe = "dist/DPort-$v.exe"
          $sha = "dist/DPort-$v.exe.sha256"

          if (-not (Test-Path $exe)) { throw "Missing release asset: $exe" }
          if (-not (Test-Path $sha)) { throw "Missing checksum: $sha" }


          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing assets."
            gh release upload $tag $exe $sha --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag" }
            gh release edit $tag --repo "${{ github.repository }}" --title "DPort v$v" --latest
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $exe $sha --repo "${{ github.repository }}" --title "DPort v$v" --latest --generate-notes --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }

          Write-Host "Published DPort v$v to GitHub Releases."

# DPort release policy: current stable is 6.9.0; next release is 6.9.1.
