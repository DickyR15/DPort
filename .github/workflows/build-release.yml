name: DPort Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DPort version (manual build, e.g. 6.9.0)'
        required: true
        default: '6.9.0'

permissions:
  contents: write

concurrency:
  group: dport-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DPort source
        shell: pwsh
        run: |
          git status --short
          git ls-tree -r --name-only HEAD | Select-String -SimpleMatch 'DPort-source-6.9.0.zip'
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) {
            Write-Host 'Working tree does not contain the ZIP; restoring directly from HEAD blob...'
            git show HEAD:DPort-source-6.9.0.zip | Set-Content -AsByteStream DPort-source-6.9.0.zip
          }
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort-source-6.9.0.zip is missing from both working tree and HEAD.' }

          $zip = Get-Item 'DPort-source-6.9.0.zip'
          Write-Host "Source ZIP size: $($zip.Length) bytes"
          $tmp = Join-Path $env:RUNNER_TEMP 'dport-source'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $tmp -Force

          $sourceRoot = Join-Path $tmp 'DPort-6.9.0'
          if (-not (Test-Path $sourceRoot)) {
            throw "Unexpected source ZIP layout. Expected $sourceRoot"
          }

          $copy = @('DPort-6.9.0.ico','requirements-build.txt','build_final_live.bat','python_runtime.txt','DPort_CHANGELOG.txt','version_info.txt')
          foreach ($item in $copy) {
            $p = Join-Path $sourceRoot $item
            if (Test-Path $p) { Copy-Item -LiteralPath $p -Destination . -Force }
          }

          $sourceSrc = Join-Path $sourceRoot 'src'
          if (Test-Path $sourceSrc) {
            if (Test-Path 'src') { Remove-Item 'src' -Recurse -Force }
            New-Item -ItemType Directory -Force -Path 'src' | Out-Null
            Copy-Item -Path (Join-Path $sourceSrc '*') -Destination 'src' -Recurse -Force
          }

          if (-not (Test-Path 'src/main.py')) {
            Write-Host 'Restored source tree:'
            Get-ChildItem -Recurse -Depth 3 $sourceRoot | Select-Object FullName
            throw 'Source restore failed: src/main.py is missing.'
          }

      - name: Normalize DPort version to 6.9.0
        shell: pwsh
        run: |
          $v = '6.9.0'
          Set-Content -LiteralPath 'src/dport_version.py' -Value ('DPORT_VERSION="{0}"' -f $v) -Encoding utf8

          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw
          $html = $html -replace '6\.9\.1', '6.9.0'
          $html = $html -replace 'DPort v?6\.9\.1', 'DPort v6.9.0'
          Set-Content -LiteralPath $map -Value $html -Encoding utf8

          Write-Host 'Build version normalized to DPort 6.9.0.'
          Write-Host 'Map UI version references normalized from 6.9.1 to 6.9.0.'
      - name: Remove legacy version badge
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw
          $old = '<span class="dport-version-badge">6.9.0</span>'
          if (-not $html.Contains($old)) { throw 'Legacy 6.9.0 version badge was not found.' }
          $html = $html.Replace($old, '')
          Set-Content -LiteralPath $map -Value $html -Encoding utf8
          Write-Host 'Removed legacy 6.9.0 version badge from map.html.'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # DPort 目前固定以 6.9.0 發行；Tag / 手動輸入不再改變產品版本。
          $v = '6.9.0'
          "version=$v" >> $env:GITHUB_OUTPUT
          Set-Content src/dport_version.py ('DPORT_VERSION="{0}"' -f $v) -Encoding utf8
          $parts = $v.Split('.') | ForEach-Object { [int]$_ }
          $vi = @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            "    prodvers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','$v'),",
            "    StringStruct('InternalName','DPort-$v'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-$v.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','$v'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine
          $vi | Set-Content version_info.generated.txt -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw 'Missing GitHub Actions secret MOENV_API_KEY.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'moenv_api_key.txt'), $env:MOENV_API_KEY.Trim(), (New-Object Text.UTF8Encoding($false)))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2
          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          $line = Get-Content requirements-build.txt | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1
          if (-not $line) { throw 'Could not determine pymobiledevice3 pin from requirements-build.txt' }
          $expected = $line.Trim().Substring('pymobiledevice3=='.Length).Trim()
          if ($pm3 -ne $expected) { throw "Expected pymobiledevice3 $expected, got $pm3" }

      - name: Fix device refresh state
        shell: pwsh
        run: |
          python scripts/fix_device_refresh.py

      - name: Final UI polish
        shell: pwsh
        run: |
          python scripts/final_ui_polish.py

      - name: Adjust top header layout
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw

          $patch = @'
          <style id="dport-top-header-layout-v1">
          @media (min-width:1000px){
            .dport-top-header-layout{
              position:relative !important;
              --dport-device-w:300px;
              --dport-notice-w:360px;
              --dport-top-gap:12px;
            }
            .dport-top-header-layout .dport-device-shell{
              position:absolute !important;
              top:8px !important;
              right:8px !important;
              width:var(--dport-device-w) !important;
              max-width:var(--dport-device-w) !important;
              min-width:var(--dport-device-w) !important;
              flex:0 0 var(--dport-device-w) !important;
              box-sizing:border-box !important;
            }
            .dport-top-header-layout .dport-notice-shell{
              position:absolute !important;
              top:8px !important;
              right:calc(var(--dport-device-w) + var(--dport-top-gap)) !important;
              width:var(--dport-notice-w) !important;
              max-width:var(--dport-notice-w) !important;
              min-width:0 !important;
              box-sizing:border-box !important;
            }
            .dport-top-header-layout .dport-notice-shell > *{
              width:100% !important;
              max-width:100% !important;
              box-sizing:border-box !important;
            }
            .dport-top-header-layout .dport-device-shell select,
            .dport-top-header-layout .dport-device-shell [role="combobox"]{
              width:100% !important;
              max-width:100% !important;
              box-sizing:border-box !important;
            }
          }
          @media (min-width:1800px){
            .dport-top-header-layout{
              --dport-device-w:320px;
              --dport-notice-w:380px;
              --dport-top-gap:14px;
            }
          }
          @media (max-width:1399px) and (min-width:1000px){
            .dport-top-header-layout{
              --dport-device-w:280px;
              --dport-notice-w:320px;
              --dport-top-gap:10px;
            }
          }
          @media (max-width:999px){
            .dport-top-header-layout .dport-device-shell,
            .dport-top-header-layout .dport-notice-shell{
              position:static !important;
              width:auto !important;
              max-width:none !important;
              min-width:0 !important;
            }
          }
          </style>
          <script id="dport-top-header-layout-script-v1">
          (function(){
            function cleanText(el){
              return String((el && (el.innerText || el.textContent)) || '')
                .replace(/\s+/g,' ')
                .trim();
            }
            function area(el){
              var r=el.getBoundingClientRect();
              return Math.max(0,r.width)*Math.max(0,r.height);
            }
            function findDeviceControl(){
              var selects=Array.prototype.slice.call(document.querySelectorAll('select'));
              var found=selects.filter(function(el){
                var t=cleanText(el);
                var options=Array.prototype.slice.call(el.options || []).map(function(o){return cleanText(o);}).join(' ');
                return /USB\s*:/i.test(t+' '+options) && /iOS/i.test(t+' '+options);
              });
              if(found.length) return found.sort(function(a,b){return area(a)-area(b);})[0];
              var all=Array.prototype.slice.call(document.querySelectorAll('body *'));
              var matched=all.filter(function(el){
                var t=cleanText(el);
                var r=el.getBoundingClientRect();
                return /USB\s*:/i.test(t) && /iOS/i.test(t) && r.width>100 && r.height>20;
              });
              return matched.sort(function(a,b){return area(a)-area(b);})[0] || null;
            }
            function findDeviceShell(control){
              if(!control) return null;
              var cur=control;
              for(var i=0;i<7 && cur;i++,cur=cur.parentElement){
                var t=cleanText(cur);
                if(/USB\s*:/i.test(t) && /重新整理/i.test(t) && /離開/i.test(t)) return cur;
              }
              return control.parentElement || control;
            }
            function findNotification(){
              var all=Array.prototype.slice.call(document.querySelectorAll('body *'));
              var hits=all.filter(function(el){
                var t=cleanText(el);
                if(t.indexOf('請先連接裝置')<0) return false;
                var r=el.getBoundingClientRect();
                return r.width>160 && r.width<900 && r.height>35 && r.height<220;
              });
              return hits.sort(function(a,b){return area(a)-area(b);})[0] || null;
            }
            function findNotificationShell(note){
              if(!note) return null;
              var cur=note;
              for(var i=0;i<5 && cur;i++,cur=cur.parentElement){
                var t=cleanText(cur), r=cur.getBoundingClientRect();
                if(t.indexOf('請先連接裝置')>=0 && r.width>220 && r.height>45) return cur;
              }
              return note;
  }
  function lowestCommonHeader(a,b){
    if(!a || !b) return null;
    var seen=[];
    for(var cur=a;cur;cur=cur.parentElement) seen.push(cur);
    var best=null,bestArea=Infinity;
    for(var i=0;i<seen.length;i++){
      var candidate=seen[i], t=cleanText(candidate), r=candidate.getBoundingClientRect();
      if(!r || r.width<700 || r.height<55 || r.height>320) continue;
      if(t.indexOf('請先連接裝置')<0 || !/USB\s*:/i.test(t)) continue;
      var ar=area(candidate);
      if(ar<bestArea){bestArea=ar;best=candidate;}
    }
    return best;
  }
  function arrange(){
    var control=findDeviceControl();
    var device=findDeviceShell(control);
    var note=findNotification();
    var notice=findNotificationShell(note);
    var header=lowestCommonHeader(device,notice);
    if(!device || !notice || !header) return false;
    header.classList.add('dport-top-header-layout');
    device.classList.add('dport-device-shell');
    notice.classList.add('dport-notice-shell');
    return true;
  }
  function boot(){
    if(arrange()) return;
    [200,500,1000,1800,3000].forEach(function(ms){setTimeout(arrange,ms);});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
  window.addEventListener('load',arrange);
})();
</script>
'@

          if ($html -notmatch 'dport-top-header-layout-v1') {
            $html = $html -replace '</body>', ($patch + [Environment]::NewLine + '</body>')
          }
          Set-Content -LiteralPath $map -Value $html -Encoding utf8
          Write-Host 'Top header adjusted: shorter device list, notification directly to its left, balanced gaps.'

      - name: Enable SHA-aware same-version updater
        shell: pwsh
        run: |
          python scripts/patch_sha_update_support.py

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile src/main.py src/dport_version.py src/dport_release_updater.py src/dport_updater_helper.py

      - name: Build embedded updater
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          $args = @('--noconfirm','--clean','--onefile','--name','DPortUpdater','--collect-all','certifi','--hidden-import','importlib.metadata','src/dport_updater_helper.py')
          python -m PyInstaller @args
          New-Item -ItemType Directory -Force -Path build/updater | Out-Null
          Copy-Item dist/DPortUpdater.exe build/updater/DPortUpdater.exe -Force

      - name: Build DPort
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $pyargs = @(
            '--noconfirm','--clean','--onefile',
            '--name',("DPort-$v"),
            '--icon','DPort-6.9.0.ico',
            '--collect-all','pymobiledevice3',
            '--collect-all','pytun_pmd3',
            '--collect-all','pyimg4',
            '--collect-all','inquirer3',
            '--copy-metadata','pymobiledevice3',
            '--copy-metadata','pyimg4',
            '--copy-metadata','readchar',
            '--hidden-import','pymobiledevice3.remote.userspace_tunnel',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.dvt_provider',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.location_simulation',
            '--hidden-import','pymobiledevice3.usbmux',
            '--hidden-import','dport_release_updater',
            '--hidden-import','dport_version',
            '--add-data','src/templates;templates',
            '--add-data','moenv_api_key.txt;.',
            '--add-binary','build/updater/DPortUpdater.exe;dport_updater',
            '--version-file','version_info.generated.txt',
            'src/main.py'
          )
          python -m PyInstaller @pyargs

      - name: Verify built EXE
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Build output is unexpectedly small.' }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Set-Content "dist/DPort-$v.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-${{ steps.version.outputs.version }}-windows
          path: |
            dist/DPort-${{ steps.version.outputs.version }}.exe
            dist/DPort-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $exe = "dist/DPort-$v.exe"
          $sha = "dist/DPort-$v.exe.sha256"

          if (-not (Test-Path $exe)) { throw "Missing release asset: $exe" }
          if (-not (Test-Path $sha)) { throw "Missing checksum: $sha" }

          # Remove the previous 6.9.1 Release/tag so DPort only exposes 6.9.0 as the current release.
          gh release view v6.9.1 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Removing obsolete v6.9.1 Release and tag.'
            gh release delete v6.9.1 --repo "${{ github.repository }}" --yes --cleanup-tag
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing assets."
            gh release upload $tag $exe $sha --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag" }
            gh release edit $tag --repo "${{ github.repository }}" --title "DPort v$v" --latest
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $exe $sha --repo "${{ github.repository }}" --title "DPort v$v" --latest --generate-notes --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }

          Write-Host "Published DPort v$v to GitHub Releases."
