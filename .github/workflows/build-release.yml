name: DPort Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'DPort version (manual build, e.g. 6.9.2)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dport-build-main
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source from committed package
        shell: pwsh
        run: |
          $repair = '${{ github.event.head_commit.message }}'.Contains('[repair-6.9.1]')
          $sourceZip = Join-Path $env:RUNNER_TEMP 'dport-source-input.zip'

          if ($repair) {
            $knownGood = '68a95030bb1f23accb53bf542ac0f59433b754a7'
            Write-Host "6.9.1 repair: recovering known-good source package from $knownGood"
            git show "$knownGood`:DPort-source-6.9.0.zip" > $sourceZip
            $tmp0 = Join-Path $env:RUNNER_TEMP 'dport-source-known-good'
            if (Test-Path $tmp0) { Remove-Item $tmp0 -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $tmp0 | Out-Null
            Expand-Archive -LiteralPath $sourceZip -DestinationPath $tmp0 -Force
            $root0 = Get-ChildItem -LiteralPath $tmp0 -Directory | Select-Object -First 1
            if (-not $root0) { throw 'Known-good source root not found.' }
            Set-Content -LiteralPath (Join-Path $root0 'src\dport_version.py') -Value 'DPORT_VERSION="6.9.1"' -Encoding utf8
            $req0 = Join-Path $root0 'requirements-build.txt'
            $reqText0 = Get-Content $req0 -Raw
            $reqText0 = [regex]::Replace($reqText0, '(?m)^\s*pymobiledevice3\s*==\s*[^\r\n#]+', 'pymobiledevice3==11.19.4')
            Set-Content -LiteralPath $req0 -Value $reqText0 -Encoding utf8
            $fixedZip = Join-Path $env:RUNNER_TEMP 'dport-source-repair.zip'
            Compress-Archive -Path $root0 -DestinationPath $fixedZip -CompressionLevel Optimal -Force
            Copy-Item -LiteralPath $fixedZip -Destination 'DPort-source-6.9.0.zip' -Force
            Copy-Item -LiteralPath $fixedZip -Destination $sourceZip -Force
          } else {
            if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort-source-6.9.0.zip is missing.' }
            Copy-Item -LiteralPath 'DPort-source-6.9.0.zip' -Destination $sourceZip -Force
          }

          $tmp = Join-Path $env:RUNNER_TEMP 'dport-source'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $tmp -Force
          $root = Get-ChildItem -LiteralPath $tmp -Directory | Select-Object -First 1
          if (-not $root) { throw 'DPort source root not found.' }
          foreach ($required in @('src\main.py','src\dport_version.py','src\dport_release_updater.py','requirements-build.txt','DPort-6.9.0.ico')) {
            if (-not (Test-Path (Join-Path $root $required))) { throw "Source package missing: $required" }
          }
          if (Test-Path 'src') { Remove-Item 'src' -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'src' | Out-Null
          Copy-Item -Path (Join-Path $root 'src\*') -Destination 'src' -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'requirements-build.txt') -Destination 'requirements-build.txt' -Force
          Copy-Item -LiteralPath (Join-Path $root 'DPort-6.9.0.ico') -Destination 'DPort-6.9.0.ico' -Force
          $repoVersion = Get-Content 'src\dport_version.py' -Raw
          $packageVersion = Get-Content (Join-Path $root 'src\dport_version.py') -Raw
          if ($repoVersion -ne $packageVersion) { throw 'Source version mismatch.' }
          $line = Get-Content 'requirements-build.txt' | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1
          if (-not $line) { throw 'pymobiledevice3 pin missing.' }
          Write-Host "Using committed source package: $root"
          Write-Host "Dependency pin: $($line.Trim())"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath 'src\dport_version.py' -Raw
          if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'DPORT_VERSION not found.' }
          $v = $Matches[1]
          $inputVersion = '${{ inputs.version }}'.Trim()
          if (-not [string]::IsNullOrWhiteSpace($inputVersion) -and $inputVersion -ne $v) { throw "Manual version $inputVersion does not match source version $v." }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid DPort version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw 'Missing MOENV_API_KEY secret.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'moenv_api_key.txt'), $env:MOENV_API_KEY.Trim(), (New-Object Text.UTF8Encoding($false)))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2
          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          $expected = (Get-Content requirements-build.txt | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1).Trim().Substring('pymobiledevice3=='.Length).Trim()
          if ($pm3 -ne $expected) { throw "Expected pymobiledevice3 $expected, got $pm3" }

      - name: Fix device refresh state
        if: ${{ !contains(github.event.head_commit.message, '[repair-6.9.1]') }}
        shell: pwsh
        run: |
          python scripts/fix_device_refresh.py

      - name: Final UI polish
        if: ${{ !contains(github.event.head_commit.message, '[repair-6.9.1]') }}
        shell: pwsh
        run: |
          python scripts/final_ui_polish.py

      - name: Fix startup render flicker
        if: ${{ !contains(github.event.head_commit.message, '[repair-6.9.1]') }}
        shell: pwsh
        run: |
          python scripts/fix_startup_render.py

      - name: Sync final source package
        shell: pwsh
        run: |
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort-source-6.9.0.zip is missing.' }
          $tmp = Join-Path $env:RUNNER_TEMP 'dport-final-source'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $tmp -Force
          $root = Join-Path $tmp 'DPort-6.9.0'
          $packageSrc = Join-Path $root 'src'
          if (-not (Test-Path $packageSrc)) { throw 'Source package src directory is missing.' }
          Remove-Item $packageSrc -Recurse -Force
          New-Item -ItemType Directory -Force -Path $packageSrc | Out-Null
          Copy-Item -Path 'src\*' -Destination $packageSrc -Recurse -Force
          $newZip = Join-Path $env:RUNNER_TEMP 'DPort-source-6.9.0.final.zip'
          if (Test-Path $newZip) { Remove-Item $newZip -Force }
          Compress-Archive -Path $root -DestinationPath $newZip -CompressionLevel Optimal -Force
          Copy-Item -LiteralPath $newZip -Destination 'DPort-source-6.9.0.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DPort-source-6.9.0.zip
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: sync final DPort source package [skip ci]'
            git push origin HEAD:main
            Write-Host 'Final source package committed before release.'
          } else {
            Write-Host 'Final source package already matches the build source.'
          }
      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q src scripts
          python -m py_compile src/main.py src/dport_version.py src/dport_release_updater.py src/dport_updater_helper.py
          $u = Get-Content 'src/dport_release_updater.py' -Raw
          foreach ($token in @('_current_exe_sha256','_release_exe_sha256','current_sha256','latest_sha256','same_version_build','_get_update_candidate_version_only')) { if ($u.Contains($token)) { throw "Forbidden same-version SHA updater token remains: $token" } }
          if ($u -notmatch 'def _get_update_candidate\(current:\s*str\)') { throw 'Version-only updater signature is missing.' }

      - name: Validate final header layout
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content $map -Raw
          foreach ($name in @('dport-hero','dport-brand','dport-ultra-gpx-slot','dport-ultra-device-slot','dport-hero-actions')) { if ($html -notmatch [regex]::Escape($name)) { throw "Missing header selector: $name" } }
          if (([regex]::Matches($html, 'id="dport-header-final-v2"')).Count -ne 1) { throw 'Expected exactly one final header style block.' }
          if ($html -match 'dport-top-header-final-v[0-9]+|dport-top-header-layout-v[0-9]+|dport-ultra-header-layout-v[0-9]+|dport-persistent-notification') { throw 'Legacy header layer remains.' }
          if ($html -notmatch '.dport-hero-notifications{[^}]*display:none') { throw 'Header notification area is not fully removed.' }
          if ($html -notmatch '#device\{[^}]*display:block!important[^}]*width:100%!important') { throw 'Device selector width rule is missing.' }

      - name: Build embedded updater
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          python -m PyInstaller --noconfirm --clean --onefile --name DPortUpdater --collect-all certifi --hidden-import importlib.metadata src/dport_updater_helper.py
          New-Item -ItemType Directory -Force -Path build/updater | Out-Null
          Copy-Item dist/DPortUpdater.exe build/updater/DPortUpdater.exe -Force

      - name: Generate version metadata
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $p = $v.Split('.') | ForEach-Object { [int]$_ }
          @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($($p[0]),$($p[1]),$($p[2]),0),",
            "    prodvers=($($p[0]),$($p[1]),$($p[2]),0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','$v'),",
            "    StringStruct('InternalName','DPort-$v'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-$v.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','$v'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine | Set-Content version_info.generated.txt -Encoding utf8

      - name: Build DPort
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $args = @('--noconfirm','--clean','--onefile','--name',("DPort-$v"),'--icon','DPort-6.9.0.ico','--collect-all','pymobiledevice3','--collect-all','pytun_pmd3','--collect-all','pyimg4','--collect-all','inquirer3','--copy-metadata','pymobiledevice3','--copy-metadata','pyimg4','--copy-metadata','readchar','--hidden-import','pymobiledevice3.remote.userspace_tunnel','--hidden-import','pymobiledevice3.services.dvt.instruments.dvt_provider','--hidden-import','pymobiledevice3.services.dvt.instruments.location_simulation','--hidden-import','pymobiledevice3.usbmux','--hidden-import','dport_release_updater','--hidden-import','dport_version','--add-data','src/templates;templates','--add-data','moenv_api_key.txt;.','--add-binary','build/updater/DPortUpdater.exe;dport_updater','--version-file','version_info.generated.txt','src/main.py')
          python -m PyInstaller @args

      - name: Verify EXE
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small.' }
          pyi-archive_viewer $exe | Out-File "dist/DPort-$v.archive.txt" -Encoding utf8
          $archive = Get-Content "dist/DPort-$v.archive.txt" -Raw
          foreach ($name in @('pymobiledevice3','pytun_pmd3','pyimg4')) { if ($archive -notmatch $name) { throw "Missing packaged dependency: $name" } }

      - name: Smoke test
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $p = Start-Process -FilePath "dist\DPort-$v.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "DPort exited with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          (Get-FileHash "dist/DPort-$v.exe" -Algorithm SHA256).Hash.ToLower() | Set-Content "dist/DPort-$v.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-${{ steps.version.outputs.version }}-windows
          path: |
            dist/DPort-${{ steps.version.outputs.version }}.exe
            dist/DPort-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $exe = "dist/DPort-$v.exe"
          $sha = "dist/DPort-$v.exe.sha256"
          $repair = '${{ github.event.head_commit.message }}'.Contains('[repair-6.9.1]')

          if (-not (Test-Path $exe)) { throw "Missing release asset: $exe" }
          if (-not (Test-Path $sha)) { throw "Missing release checksum: $sha" }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists -and -not $repair) {
            Write-Host "Release $tag already exists; normal build will not overwrite it."
            exit 0
          }

          $tagCommit = git rev-parse HEAD
          if ($repair) {
            Write-Host "One-time repair: aligning $tag to $tagCommit and replacing release assets."
            git tag -f $tag $tagCommit
            git push origin "refs/tags/$tag" --force
            if ($LASTEXITCODE -ne 0) { throw "Failed to update tag $tag" }
            gh release upload $tag $exe $sha --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace assets in $tag" }
            gh release edit $tag --repo "${{ github.repository }}" --title "DPort v$v" --latest
          } else {
            gh release create $tag $exe $sha --repo "${{ github.repository }}" --title "DPort v$v" --latest --generate-notes --target $tagCommit
          }

          Write-Host "Published DPort v$v from commit $tagCommit."

# Release policy: build and verify the committed source package first; create vX.Y.Z only after all checks succeed.