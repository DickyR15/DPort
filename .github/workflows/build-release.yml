name: DPort Build & Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DPort version (manual build, e.g. 6.9.0)'
        required: true
        default: '6.9.0'

permissions:
  contents: write

concurrency:
  group: dport-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DPort source
        shell: pwsh
        run: |
          git status --short
          git ls-tree -r --name-only HEAD | Select-String -SimpleMatch 'DPort-source-6.9.0.zip'
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) {
            Write-Host 'Working tree does not contain the ZIP; restoring directly from HEAD blob...'
            git show HEAD:DPort-source-6.9.0.zip | Set-Content -AsByteStream DPort-source-6.9.0.zip
          }
          if (-not (Test-Path 'DPort-source-6.9.0.zip')) { throw 'DPort-source-6.9.0.zip is missing from both working tree and HEAD.' }

          $zip = Get-Item 'DPort-source-6.9.0.zip'
          Write-Host "Source ZIP size: $($zip.Length) bytes"
          $tmp = Join-Path $env:RUNNER_TEMP 'dport-source'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -LiteralPath 'DPort-source-6.9.0.zip' -DestinationPath $tmp -Force

          $sourceRoot = Join-Path $tmp 'DPort-6.9.0'
          if (-not (Test-Path $sourceRoot)) {
            throw "Unexpected source ZIP layout. Expected $sourceRoot"
          }

          $copy = @('DPort-6.9.0.ico','requirements-build.txt','build_final_live.bat','python_runtime.txt','DPort_CHANGELOG.txt','version_info.txt')
          foreach ($item in $copy) {
            $p = Join-Path $sourceRoot $item
            if (Test-Path $p) { Copy-Item -LiteralPath $p -Destination . -Force }
          }

          # Keep the known-good dependency baseline from 936fd96: build with pymobiledevice3 11.19.1.
          $srcReq = Join-Path $sourceRoot 'requirements-build.txt'
          if (-not (Test-Path $srcReq)) { throw "Source requirements file missing: $srcReq" }
          $srcReqText = Get-Content -LiteralPath $srcReq -Raw
          $srcReqText = $srcReqText -replace 'pymobiledevice3==11\.18\.0', 'pymobiledevice3==11.19.1'
          if ($srcReqText -notmatch 'pymobiledevice3==11\.19\.1') { throw 'Failed to pin pymobiledevice3 11.19.1 in restored source.' }
          Set-Content -LiteralPath $srcReq -Value $srcReqText -Encoding utf8

          $sourceSrc = Join-Path $sourceRoot 'src'
          if (Test-Path $sourceSrc) {
            if (Test-Path 'src') { Remove-Item 'src' -Recurse -Force }
            New-Item -ItemType Directory -Force -Path 'src' | Out-Null
            Copy-Item -Path (Join-Path $sourceSrc '*') -Destination 'src' -Recurse -Force
          }

          if (-not (Test-Path 'src/main.py')) {
            Write-Host 'Restored source tree:'
            Get-ChildItem -Recurse -Depth 3 $sourceRoot | Select-Object FullName
            throw 'Source restore failed: src/main.py is missing.'
          }

      - name: Normalize DPort version to 6.9.0
        shell: pwsh
        run: |
          $v = '6.9.0'
          Set-Content -LiteralPath 'src/dport_version.py' -Value ('DPORT_VERSION="{0}"' -f $v) -Encoding utf8

          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw
          $html = $html -replace '6\.9\.1', '6.9.0'
          $html = $html -replace 'DPort v?6\.9\.1', 'DPort v6.9.0'
          Set-Content -LiteralPath $map -Value $html -Encoding utf8

          Write-Host 'Build version normalized to DPort 6.9.0.'
          Write-Host 'Map UI version references normalized from 6.9.1 to 6.9.0.'
      - name: Remove legacy version badge
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw
          $old = '<span class="dport-version-badge">6.9.0</span>'
          if (-not $html.Contains($old)) { throw 'Legacy 6.9.0 version badge was not found.' }
          $html = $html.Replace($old, '')
          Set-Content -LiteralPath $map -Value $html -Encoding utf8
          Write-Host 'Removed legacy 6.9.0 version badge from map.html.'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # DPort 目前固定以 6.9.0 發行；Tag / 手動輸入不再改變產品版本。
          $v = '6.9.0'
          "version=$v" >> $env:GITHUB_OUTPUT
          Set-Content src/dport_version.py ('DPORT_VERSION="{0}"' -f $v) -Encoding utf8
          $parts = $v.Split('.') | ForEach-Object { [int]$_ }
          $vi = @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            "    prodvers=($($parts[0]),$($parts[1]),$($parts[2]),0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','$v'),",
            "    StringStruct('InternalName','DPort-$v'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-$v.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','$v'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine
          $vi | Set-Content version_info.generated.txt -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare MOENV API key
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw 'Missing GitHub Actions secret MOENV_API_KEY.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'moenv_api_key.txt'), $env:MOENV_API_KEY.Trim(), (New-Object Text.UTF8Encoding($false)))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2
          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          $line = Get-Content requirements-build.txt | Where-Object { $_.Trim().StartsWith('pymobiledevice3==') } | Select-Object -First 1
          if (-not $line) { throw 'Could not determine pymobiledevice3 pin from requirements-build.txt' }
          $expected = $line.Trim().Substring('pymobiledevice3=='.Length).Trim()
          if ($pm3 -ne $expected) { throw "Expected pymobiledevice3 $expected, got $pm3" }

      - name: Fix device refresh state
        shell: pwsh
        run: |
          python scripts/fix_device_refresh.py

      - name: Final UI polish
        shell: pwsh
        run: |
          python scripts/final_ui_polish.py

      - name: Adjust top header layout
        shell: pwsh
        run: |
          $map = 'src/templates/map.html'
          if (-not (Test-Path $map)) { throw "UI template not found: $map" }
          $html = Get-Content -LiteralPath $map -Raw

          $patch = @'
<style id="dport-top-header-layout-v2">
/*
  DPort header layout v2:
  - The connection selector is kept at the far right and made compact.
  - The DPort status/notification card is physically repositioned to the
    immediate left of the connection control.
  - The notification follows the connection control while scrolling/resizing.
*/
#dport-top-device-shell-v2{
  box-sizing:border-box !important;
  width:280px !important;
  max-width:280px !important;
  min-width:280px !important;
}
#dport-top-device-shell-v2 select,
#dport-top-device-shell-v2 [role="combobox"]{
  width:100% !important;
  max-width:100% !important;
  box-sizing:border-box !important;
}
#dport-top-notice-v2{
  position:fixed !important;
  z-index:3000 !important;
  box-sizing:border-box !important;
  width:300px !important;
  max-width:300px !important;
  min-width:180px !important;
  margin:0 !important;
  padding:0 !important;
  pointer-events:auto !important;
}
#dport-top-notice-v2 > *{
  width:100% !important;
  max-width:100% !important;
  box-sizing:border-box !important;
}
#dport-top-notice-v2 .dport-notice-card-v2{
  width:100% !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
}
@media (min-width:1800px){
  #dport-top-device-shell-v2{
    width:300px !important;
    max-width:300px !important;
    min-width:300px !important;
  }
  #dport-top-notice-v2{
    width:330px !important;
    max-width:330px !important;
  }
}
@media (max-width:999px){
  #dport-top-device-shell-v2{
    width:240px !important;
    max-width:240px !important;
    min-width:240px !important;
  }
  #dport-top-notice-v2{
    width:240px !important;
    max-width:240px !important;
    min-width:160px !important;
  }
}
</style>
<script id="dport-top-header-layout-script-v2">
(function(){
  function textOf(el){
    return String((el && (el.innerText || el.textContent)) || '')
      .replace(/\s+/g,' ')
      .trim();
  }

  function rect(el){
    return el ? el.getBoundingClientRect() : null;
  }

  function area(el){
    var r=rect(el);
    return r ? Math.max(0,r.width)*Math.max(0,r.height) : 0;
  }

  function findDeviceControl(){
    var selects=Array.prototype.slice.call(document.querySelectorAll('select'));
    var direct=selects.filter(function(el){
      var t=textOf(el);
      var opts=Array.prototype.slice.call(el.options||[])
        .map(function(o){return textOf(o);}).join(' ');
      return /USB\s*:/i.test(t+' '+opts) && /iOS/i.test(t+' '+opts);
    });
    if(direct.length) return direct.sort(function(a,b){return area(a)-area(b);})[0];

    var all=Array.prototype.slice.call(document.querySelectorAll('body *'));
    var fallback=all.filter(function(el){
      var t=textOf(el), r=rect(el);
      return r && r.width>120 && r.height>25 &&
        /USB\s*:/i.test(t) && /iOS/i.test(t);
    });
    return fallback.sort(function(a,b){return area(a)-area(b);})[0] || null;
  }

  function findDeviceShell(control){
    if(!control) return null;
    var cur=control;
    for(var i=0;i<9 && cur;i++,cur=cur.parentElement){
      var t=textOf(cur), r=rect(cur);
      if(r && r.width>180 && r.height>30 &&
         /USB\s*:/i.test(t) &&
         /重新整理/i.test(t) &&
         /離開/i.test(t)){
        return cur;
      }
    }
    return control.parentElement || control;
  }

  function findNotice(){
    var all=Array.prototype.slice.call(document.querySelectorAll('body *'));
    var hits=all.filter(function(el){
      var t=textOf(el), r=rect(el);
      if(!r || r.width<180 || r.height<35 || r.height>260) return false;
      return /請先連接裝置/i.test(t) &&
             /再進行模擬定位/i.test(t);
    });
    hits.sort(function(a,b){return area(a)-area(b);});
    return hits[0] || null;
  }

  function findNoticeCard(notice){
    if(!notice) return null;
    var cur=notice;
    for(var i=0;i<6 && cur;i++,cur=cur.parentElement){
      var t=textOf(cur), r=rect(cur);
      if(r && r.width>=220 && r.height>=55 && r.height<=320 &&
         /請先連接裝置/i.test(t)){
        return cur;
      }
    }
    return notice;
  }

  function placeNotice(notice, device){
    if(!notice || !device) return false;

    notice.id='dport-top-notice-v2';
    var card=notice;
    card.classList.add('dport-notice-card-v2');

    /*
      Physically move the notification into the document body. This is what
      prevents the old left-panel layout from pulling it back to the bottom.
      Event handlers remain attached when an existing DOM node is reparented.
    */
    if(notice.parentElement !== document.body){
      document.body.appendChild(notice);
    }

    var dr=device.getBoundingClientRect();
    if(!dr || dr.width<=0 || dr.height<=0) return false;

    var gap=12;
    var minLeft=8;
    var desiredWidth=300;
    var noticeWidth=Math.min(desiredWidth, Math.max(180, dr.left-gap-minLeft));

    if(dr.left-gap-minLeft < 180){
      // On narrower windows, keep it left of the device control by shrinking.
      noticeWidth=Math.max(160, dr.left-gap-minLeft);
    }

    notice.style.width=noticeWidth+'px';
    notice.style.maxWidth=noticeWidth+'px';
    notice.style.minWidth=Math.min(160,noticeWidth)+'px';

    var top=Math.max(8, dr.top);
    var left=Math.max(minLeft, dr.left-gap-noticeWidth);

    // Keep the notice inside the viewport without changing its left-of-device
    // relationship.
    if(left+noticeWidth > window.innerWidth-8){
      left=Math.max(minLeft, window.innerWidth-8-noticeWidth);
    }
    notice.style.top=top+'px';
    notice.style.left=left+'px';
    return true;
  }

  function compactDeviceShell(device){
    if(!device) return false;
    device.id='dport-top-device-shell-v2';

    var parent=device.parentElement;
    var p2=parent ? parent.parentElement : null;
    [parent,p2].forEach(function(host){
      if(!host) return;
      var cs=getComputedStyle(host);
      if(cs.display==='flex' || cs.display==='inline-flex'){
        host.style.setProperty('justify-content','flex-end','important');
      }
    });

    device.style.setProperty('flex','0 0 280px','important');
    device.style.setProperty('width','280px','important');
    device.style.setProperty('max-width','280px','important');
    device.style.setProperty('min-width','280px','important');

    var select=device.querySelector('select');
    if(select){
      select.style.setProperty('width','100%','important');
      select.style.setProperty('max-width','100%','important');
    }

    return true;
  }

  function arrange(){
    var control=findDeviceControl();
    var device=findDeviceShell(control);
    var note=findNotice();
    var notice=findNoticeCard(note);

    if(!device || !notice) return false;
    compactDeviceShell(device);
    placeNotice(notice,device);
    return true;
  }

  function boot(){
    arrange();
    [200,500,1000,1800,3000].forEach(function(ms){setTimeout(arrange,ms);});
  }

  function follow(){
    var device=document.getElementById('dport-top-device-shell-v2');
    var notice=document.getElementById('dport-top-notice-v2');
    if(device && notice) placeNotice(notice,device);
    else arrange();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot,{once:true});
  }else{
    boot();
  }
  window.addEventListener('load',follow);
  window.addEventListener('resize',follow);
  window.addEventListener('scroll',follow,{passive:true});
})();
</script>
'@

          if ($html -match 'dport-top-header-layout-v[0-9]+') {
            $html = [regex]::Replace(
              $html,
              '<style id="dport-top-header-layout-v[0-9]+">.*?</style>\s*<script id="dport-top-header-layout-script-v[0-9]+">.*?</script>',
              '',
              [Text.RegularExpressions.RegexOptions]::Singleline
            )
          }

          if ($html -notmatch 'dport-top-header-layout-v2') {
            $html = $html -replace '</body>', ($patch + [Environment]::NewLine + '</body>')
          }

          Set-Content -LiteralPath $map -Value $html -Encoding utf8
          Write-Host 'Header v2 applied: notification moved immediately left of compact right-side device connection control.'

      - name: Enable SHA-aware same-version updater
        shell: pwsh
        run: |
          python scripts/patch_sha_update_support.py

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile src/main.py src/dport_version.py src/dport_release_updater.py src/dport_updater_helper.py

      - name: Build embedded updater
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          $args = @('--noconfirm','--clean','--onefile','--name','DPortUpdater','--collect-all','certifi','--hidden-import','importlib.metadata','src/dport_updater_helper.py')
          python -m PyInstaller @args
          New-Item -ItemType Directory -Force -Path build/updater | Out-Null
          Copy-Item dist/DPortUpdater.exe build/updater/DPortUpdater.exe -Force

      - name: Build DPort
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $pyargs = @(
            '--noconfirm','--clean','--onefile',
            '--name',("DPort-$v"),
            '--icon','DPort-6.9.0.ico',
            '--collect-all','pymobiledevice3',
            '--collect-all','pytun_pmd3',
            '--collect-all','pyimg4',
            '--collect-all','inquirer3',
            '--copy-metadata','pymobiledevice3',
            '--copy-metadata','pyimg4',
            '--copy-metadata','readchar',
            '--hidden-import','pymobiledevice3.remote.userspace_tunnel',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.dvt_provider',
            '--hidden-import','pymobiledevice3.services.dvt.instruments.location_simulation',
            '--hidden-import','pymobiledevice3.usbmux',
            '--hidden-import','dport_release_updater',
            '--hidden-import','dport_version',
            '--add-data','src/templates;templates',
            '--add-data','moenv_api_key.txt;.',
            '--add-binary','build/updater/DPortUpdater.exe;dport_updater',
            '--version-file','version_info.generated.txt',
            'src/main.py'
          )
          python -m PyInstaller @pyargs

      - name: Verify built EXE
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Build output is unexpectedly small.' }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = "dist/DPort-$v.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Set-Content "dist/DPort-$v.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-${{ steps.version.outputs.version }}-windows
          path: |
            dist/DPort-${{ steps.version.outputs.version }}.exe
            dist/DPort-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $exe = "dist/DPort-$v.exe"
          $sha = "dist/DPort-$v.exe.sha256"

          if (-not (Test-Path $exe)) { throw "Missing release asset: $exe" }
          if (-not (Test-Path $sha)) { throw "Missing checksum: $sha" }

          # Remove the previous 6.9.1 Release/tag so DPort only exposes 6.9.0 as the current release.
          gh release view v6.9.1 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Removing obsolete v6.9.1 Release and tag.'
            gh release delete v6.9.1 --repo "${{ github.repository }}" --yes --cleanup-tag
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing assets."
            gh release upload $tag $exe $sha --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag" }
            gh release edit $tag --repo "${{ github.repository }}" --title "DPort v$v" --latest
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $exe $sha --repo "${{ github.repository }}" --title "DPort v$v" --latest --generate-notes --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }

          Write-Host "Published DPort v$v to GitHub Releases."
