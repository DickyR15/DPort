name: DPort Full Source Audit

on:
  push:
    branches:
      - test/6.9.1-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Run comprehensive source audit
        shell: pwsh
        run: python scripts/full_source_audit.py
