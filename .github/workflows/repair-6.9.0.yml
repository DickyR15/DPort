# ci: rebuild after self-copy updater fix
# ci: enforce download target beside launched DPort executable
# ci: final deterministic update order - download, verify, exit, install, delete, cleanup, relaunch
# ci: rebuild pre-exit update handoff
# ci: predownload 6.9.1 before exit
# ci: enforce final temp-folder and versioned-exe contract
# ci: rebuild after versioned filename install fix
# ci: use Python 3.9 for pymobiledevice3 11.19.1 compatibility
# ci: fix map_text initialization before release patch
# ci: final exit-button patch syntax fix
# ci: final update shutdown-path fix
# ci: direct detached updater launch
# ci: verify parent PID detection
# ci: updater helper runtime diagnostics
# FORCE REPAIR RELEASE REBUILD - standalone updater helper
# ci: standalone updater helper release rebuild - FINAL RETRY
# ci: validate browser reconnect after updater
# ci: validate copy-based updater across drive letters
name: DPort Repair Releases

on:
  push:
    paths:
      - ".github/workflows/repair-6.9.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9.13"

      - name: Validate repair sources
        shell: pwsh
        run: |
          python -m py_compile scripts/repair_release_source.py
          if ($LASTEXITCODE -ne 0) { throw "repair_release_source.py syntax validation failed." }
          python -m py_compile src/dport_updater_helper.py
          if ($LASTEXITCODE -ne 0) { throw "dport_updater_helper.py syntax validation failed." }

      - name: Test updater process wait logic
        shell: pwsh
        run: |
          python -c "import subprocess,time; from src.dport_updater_helper import _wait_for_pid_exit; p=subprocess.Popen(['python','-c','import time; time.sleep(2)']); t=time.time(); _wait_for_pid_exit(p.pid, timeout=10); elapsed=time.time()-t; print(f'waited={elapsed:.2f}s'); assert elapsed >= 1.5, f'wait logic returned too early: {elapsed:.2f}s'"
          if ($LASTEXITCODE -ne 0) { throw "Updater parent-process wait logic test failed." }

      - name: Validate updater design
        shell: pwsh
        run: |
          $helper = Get-Content src/dport_updater_helper.py -Raw
          $repair = Get-Content scripts/repair_release_source.py -Raw
          if ($helper -notmatch 'work_dir = windows_temp / "\.dport-update"') { throw "Updater must use C:\Windows\Temp\.dport-update." }
          if ($helper -notmatch 'new_target = app_dir / f"DPort-\{args.version\}\.exe"') { throw "Updater must create the versioned EXE filename." }
          if ($helper -notmatch 'old_target\.unlink\(\)') { throw "Updater must remove the old EXE only after the new process starts." }
          if ($helper -notmatch '_schedule_cleanup\(work_dir\)') { throw "Updater must clean the temporary folder." }
          if ($repair -notmatch 'update_dir = windows_temp / "\.dport-update"') { throw "DPort must place updater payloads in Windows Temp." }
          if ($repair -notmatch 'new_exe = current_exe\.parent / f"DPort-\{latest\}\.exe"') { throw "New DPort EXE must be downloaded beside the running DPort EXE." }
          if ($repair -match 'DPort-update\.ps1') { throw "Legacy PowerShell updater must not be generated." }

      - name: Prepare API key and source packages
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOENV_API_KEY)) { throw "Missing MOENV_API_KEY secret." }
          [IO.File]::WriteAllText(
            (Join-Path $PWD "moenv_api_key.txt"),
            $env:MOENV_API_KEY.Trim(),
            (New-Object Text.UTF8Encoding($false))
          )
          New-Item -ItemType Directory -Force -Path repair | Out-Null
          python scripts/repair_release_source.py --version 6.9.0 --pm3 11.19.1 --output repair/DPort-source-6.9.0.zip
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare 6.9.0 source package." }
          python scripts/repair_release_source.py --version 6.9.1 --pm3 11.19.4 --output repair/DPort-source-6.9.1.zip
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare 6.9.1 source package." }

      - name: Install common build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Failed to upgrade Python build tools." }
          python -m pip install "pyinstaller<7"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install PyInstaller." }

      - name: Build DPort 6.9.0
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dport690"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath repair/DPort-source-6.9.0.zip -DestinationPath $work -Force
          $root = Get-ChildItem -LiteralPath $work -Directory | Select-Object -First 1
          if (-not $root) { throw "6.9.0 source root not found." }

          if (Test-Path src) { Remove-Item src -Recurse -Force }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Copy-Item (Join-Path $root.FullName "src\*") src -Recurse -Force
          Copy-Item (Join-Path $root.FullName "requirements-build.txt") requirements-build.txt -Force
          Copy-Item (Join-Path $root.FullName "DPort-6.9.0.ico") DPort-6.9.0.ico -Force

          $req = Get-Content requirements-build.txt | Where-Object { $_ -and $_.Trim() -ne "pyimg4" }
          $req | Set-Content requirements-build-ci.txt -Encoding utf8
          python -m pip install -r requirements-build-ci.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to install 6.9.0 build requirements." }
          python -m pip install --index-url https://pypi.org/simple pyimg4==0.8.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to install pyimg4 0.8.8." }
          python -m pip install lzfse==0.4.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to install lzfse 0.4.2." }

          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          if ($LASTEXITCODE -ne 0) { throw "pymobiledevice3 metadata lookup failed." }
          if ($pm3 -ne "11.19.1") { throw "Expected pymobiledevice3 11.19.1, got $pm3" }

          @(
            "# UTF-8",
            "VSVersionInfo(",
            "  ffi=FixedFileInfo(",
            "    filevers=(6,9,0,0),",
            "    prodvers=(6,9,0,0),",
            "    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)",
            "  ),",
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','6.9.0'),",
            "    StringStruct('InternalName','DPort-6.9.0'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-6.9.0.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','6.9.0'),",
            "    StringStruct('Comments','Dicky')])]),",
            "    VarFileInfo([VarStruct('Translation',[0x0404,1200])])]",
            ")"
          ) | Set-Content version_info.690.txt -Encoding utf8

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }

          python -m PyInstaller --noconfirm --clean --onefile --name DPort-Updater --hidden-import dport_updater_helper src/dport_updater_helper.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for DPort-Updater." }
          if (-not (Test-Path dist/DPort-Updater.exe)) { throw "DPort-Updater.exe missing." }
          & dist/DPort-Updater.exe --help
          if ($LASTEXITCODE -ne 0) { throw "DPort-Updater.exe self-test failed to start." }
          New-Item -ItemType Directory -Force -Path repair-bin | Out-Null
          Copy-Item dist/DPort-Updater.exe repair-bin/DPort-Updater.exe -Force
          (Get-FileHash dist/DPort-Updater.exe -Algorithm SHA256).Hash.ToLower() | Set-Content repair-bin/DPort-Updater.exe.sha256 -Encoding ascii

          python -m PyInstaller --noconfirm --clean --onefile --name DPort-6.9.0 --icon DPort-6.9.0.ico --collect-all pymobiledevice3 --collect-all pytun_pmd3 --collect-all pyimg4 --collect-all inquirer3 --copy-metadata pymobiledevice3 --copy-metadata pyimg4 --copy-metadata readchar --hidden-import pymobiledevice3.remote.userspace_tunnel --hidden-import pymobiledevice3.services.dvt.instruments.dvt_provider --hidden-import pymobiledevice3.services.dvt.instruments.location_simulation --hidden-import pymobiledevice3.usbmux --hidden-import dport_release_updater --hidden-import dport_version --add-data "src/templates;templates" --add-data "moenv_api_key.txt;." --version-file version_info.690.txt src/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for DPort 6.9.0." }
          if (-not (Test-Path dist/DPort-6.9.0.exe)) { throw "DPort-6.9.0.exe missing." }

          New-Item -ItemType Directory -Force -Path repair-bin | Out-Null
          Copy-Item dist/DPort-6.9.0.exe repair-bin/DPort-6.9.0.exe -Force
          (Get-FileHash dist/DPort-6.9.0.exe -Algorithm SHA256).Hash.ToLower() | Set-Content repair-bin/DPort-6.9.0.exe.sha256 -Encoding ascii

      - name: Build DPort 6.9.1
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dport691"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath repair/DPort-source-6.9.1.zip -DestinationPath $work -Force
          $root = Get-ChildItem -LiteralPath $work -Directory | Select-Object -First 1
          if (-not $root) { throw "6.9.1 source root not found." }

          if (Test-Path src) { Remove-Item src -Recurse -Force }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Copy-Item (Join-Path $root.FullName "src\*") src -Recurse -Force
          Copy-Item (Join-Path $root.FullName "requirements-build.txt") requirements-build.txt -Force
          Copy-Item (Join-Path $root.FullName "DPort-6.9.0.ico") DPort-6.9.0.ico -Force

          $req = Get-Content requirements-build.txt | Where-Object { $_ -and $_.Trim() -ne "pyimg4" }
          $req | Set-Content requirements-build-ci.txt -Encoding utf8
          python -m pip install -r requirements-build-ci.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to install 6.9.1 build requirements." }
          python -m pip install --index-url https://pypi.org/simple pyimg4==0.8.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to install pyimg4 0.8.8." }
          python -m pip install lzfse==0.4.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to install lzfse 0.4.2." }

          $pm3 = python -c "from importlib.metadata import version; print(version('pymobiledevice3'))"
          if ($LASTEXITCODE -ne 0) { throw "pymobiledevice3 metadata lookup failed." }
          if ($pm3 -ne "11.19.4") { throw "Expected pymobiledevice3 11.19.4, got $pm3" }

          @(
            "# UTF-8",
            "VSVersionInfo(",
            "  ffi=FixedFileInfo(",
            "    filevers=(6,9,1,0),",
            "    prodvers=(6,9,1,0),",
            "    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)",
            "  ),",
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','6.9.1'),",
            "    StringStruct('InternalName','DPort-6.9.1'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-6.9.1.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','6.9.1'),",
            "    StringStruct('Comments','Dicky')])]),",
            "    VarFileInfo([VarStruct('Translation',[0x0404,1200])])]",
            ")"
          ) | Set-Content version_info.691.txt -Encoding utf8

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }

          python -m PyInstaller --noconfirm --clean --onefile --name DPort-6.9.1 --icon DPort-6.9.0.ico --collect-all pymobiledevice3 --collect-all pytun_pmd3 --collect-all pyimg4 --collect-all inquirer3 --copy-metadata pymobiledevice3 --copy-metadata pyimg4 --copy-metadata readchar --hidden-import pymobiledevice3.remote.userspace_tunnel --hidden-import pymobiledevice3.services.dvt.instruments.dvt_provider --hidden-import pymobiledevice3.services.dvt.instruments.location_simulation --hidden-import pymobiledevice3.usbmux --hidden-import dport_release_updater --hidden-import dport_version --add-data "src/templates;templates" --add-data "moenv_api_key.txt;." --version-file version_info.691.txt src/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for DPort 6.9.1." }
          if (-not (Test-Path dist/DPort-6.9.1.exe)) { throw "DPort-6.9.1.exe missing." }

          New-Item -ItemType Directory -Force -Path repair-bin | Out-Null
          Copy-Item dist/DPort-6.9.1.exe repair-bin/DPort-6.9.1.exe -Force
          (Get-FileHash dist/DPort-6.9.1.exe -Algorithm SHA256).Hash.ToLower() | Set-Content repair-bin/DPort-6.9.1.exe.sha256 -Encoding ascii

      - name: Smoke test both releases
        shell: pwsh
        run: |
          if (-not (Test-Path repair-bin/DPort-Updater.exe)) { throw "DPort-Updater.exe missing." }
          if (-not (Test-Path repair-bin/DPort-Updater.exe.sha256)) { throw "DPort-Updater.exe.sha256 missing." }

          foreach ($v in @("6.9.0","6.9.1")) {
            $exe = (Resolve-Path "repair-bin/DPort-$v.exe").Path
            $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 20

            if (-not (Test-Path $exe)) { throw "$exe disappeared during smoke test." }

            if ($p.HasExited) {
              if ($p.ExitCode -ne 0) { throw "$exe exited with code $($p.ExitCode)." }
            } else {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish repaired release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release upload v6.9.0 repair-bin/DPort-6.9.0.exe repair-bin/DPort-6.9.0.exe.sha256 repair-bin/DPort-Updater.exe repair-bin/DPort-Updater.exe.sha256 repair/DPort-source-6.9.0.zip --repo DickyR15/DPort --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish v6.9.0 assets." }

          gh release upload v6.9.1 repair-bin/DPort-6.9.1.exe repair-bin/DPort-6.9.1.exe.sha256 repair-bin/DPort-Updater.exe repair-bin/DPort-Updater.exe.sha256 repair/DPort-source-6.9.1.zip --repo DickyR15/DPort --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish v6.9.1 assets." }

          gh release edit v6.9.0 --repo DickyR15/DPort --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to mark v6.9.0 as non-latest." }

          gh release edit v6.9.1 --repo DickyR15/DPort --latest=true
          if ($LASTEXITCODE -ne 0) { throw "Failed to mark v6.9.1 as latest." }

      - name: Upload repaired artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DPort-repaired-6.9.0-6.9.1
          path: |
            repair/DPort-source-6.9.0.zip
            repair/DPort-source-6.9.1.zip
            repair-bin/DPort-6.9.0.exe
            repair-bin/DPort-6.9.0.exe.sha256
            repair-bin/DPort-6.9.1.exe
            repair-bin/DPort-6.9.1.exe.sha256
            repair-bin/DPort-Updater.exe
            repair-bin/DPort-Updater.exe.sha256
          if-no-files-found: ignore
