name: DPort WiFi Test Lint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dport-windows-wifi-test.yml'
      - '.github/workflows/dport-wifi-test-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/dport-windows-wifi-test.yml
