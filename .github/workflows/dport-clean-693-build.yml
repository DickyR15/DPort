name: DPort 6.9.3 Clean Base Build

on:
  push:
    branches:
      - test/clean-6.9.3-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout DPort v6.9.3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v6.9.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.github/python-version.txt'

      - name: Validate source
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath 'src\dport_version.py' -Raw
          if ($raw -notmatch 'DPORT_VERSION\s*=\s*["'']6\.9\.3["'']') { throw 'Not DPort 6.9.3' }
          python -m py_compile src/main.py
          python -m py_compile src/dport_version.py
          python -m py_compile src/dport_release_updater.py
          python -m py_compile src/dport_updater_helper.py
          python -m compileall -q src scripts

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip install lzfse==0.4.2 pefile

      - name: Resolve icon
        id: icon
        shell: pwsh
        run: |
          $icons = @(Get-ChildItem -LiteralPath $PWD -Filter 'DPort-*.ico' -File)
          if ($icons.Count -ne 1) { throw "Expected exactly one DPort icon, found $($icons.Count)." }
          "path=$($icons[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Build updater
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DPort-Updater --icon "${{ steps.icon.outputs.path }}" --collect-all certifi --hidden-import importlib.metadata src/dport_updater_helper.py

      - name: Generate version metadata
        shell: pwsh
        run: |
          @(
            '# UTF-8',
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            '    filevers=(6,9,3,0),',
            '    prodvers=(6,9,3,0),',
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)',
            '  ),',
            "  kids=[StringFileInfo([StringTable('040404B0',[",
            "    StringStruct('CompanyName','Dicky'),",
            "    StringStruct('FileDescription','DPort'),",
            "    StringStruct('FileVersion','6.9.3'),",
            "    StringStruct('InternalName','DPort-6.9.3'),",
            "    StringStruct('LegalCopyright','Dicky'),",
            "    StringStruct('OriginalFilename','DPort-6.9.3.exe'),",
            "    StringStruct('ProductName','DPort'),",
            "    StringStruct('ProductVersion','6.9.3'),",
            "    StringStruct('Comments','Dicky')])]),",
            '    VarFileInfo([VarStruct(''Translation'',[0x0404,1200])])]',
            ')'
          ) -join [Environment]::NewLine | Set-Content version_info.generated.txt -Encoding utf8

      - name: Build DPort 6.9.3
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DPort-6.9.3 --icon "${{ steps.icon.outputs.path }}" --collect-all pymobiledevice3 --collect-all pytun_pmd3 --collect-all pyimg4 --collect-all inquirer3 --copy-metadata pymobiledevice3 --copy-metadata pyimg4 --copy-metadata readchar --hidden-import pymobiledevice3.remote.userspace_tunnel --hidden-import pymobiledevice3.services.dvt.instruments.dvt_provider --hidden-import pymobiledevice3.services.dvt.instruments.location_simulation --hidden-import pymobiledevice3.usbmux --hidden-import dport_release_updater --hidden-import dport_version --add-data 'src/templates;templates' --add-binary 'dist/DPort-Updater.exe;dport_updater' --version-file version_info.generated.txt src/main.py
          if ($LASTEXITCODE -ne 0) { throw 'DPort 6.9.3 build failed.' }
          if (-not (Test-Path 'dist\DPort-6.9.3.exe')) { throw 'DPort-6.9.3.exe missing.' }

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist\DPort-6.9.3.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "DPort exited with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: SHA-256
        shell: pwsh
        run: |
          (Get-FileHash 'dist\DPort-6.9.3.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist\DPort-6.9.3.exe.sha256' -Encoding ascii
          (Get-FileHash 'dist\DPort-Updater.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist\DPort-Updater.exe.sha256' -Encoding ascii

      - name: Upload clean base
        uses: actions/upload-artifact@v4
        with:
          name: DPort-6.9.3-clean-base-windows
          path: |
            dist/DPort-6.9.3.exe
            dist/DPort-6.9.3.exe.sha256
            dist/DPort-Updater.exe
            dist/DPort-Updater.exe.sha256