name: Sync release notes

on:
  push:
    paths:
      - .github/workflows/sync-release-notes.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update DPort release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dport-6.9.0.md <<'EOF'
## ✨ 版本內容

- iPhone GPS 位置模擬與定位更新
- USB 裝置連線與裝置狀態管理
- 地圖定位與座標操作
- 附近地點搜尋
- 我的最愛與最近使用位置
- GPX 軌跡匯入、播放與速度調整
- 地圖互動與定位操作
- Windows 自動更新機制
- SHA-256 完整性驗證

## 📦 下載

- `DPort-6.9.0.exe`
- `DPort-6.9.0.exe.sha256`
- `DPort-Updater.exe`
- `DPort-Updater.exe.sha256`

## 📚 原始碼

本 Release 的 Windows 執行檔對應 Git Tag `v6.9.0`。

GitHub Repository：

https://github.com/DickyR15/DPort

