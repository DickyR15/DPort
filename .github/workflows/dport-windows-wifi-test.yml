name: DPort Windows WiFi Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dport-windows-wifi-test.yml'
      - 'scripts/build_dport_windows_wifi_test.ps1'

permissions:
  contents: read

jobs:
  build:
    name: Build DPort Windows WiFi Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Build DPort Windows WiFi Test
        shell: pwsh
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          ./scripts/build_dport_windows_wifi_test.ps1

      - name: Upload WiFi Test artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPort-WiFi-Test-6.9.1
          path: |
            DPort-WiFi-Test-6.9.1.zip
            dist/DPort-WiFi-Test-6.9.1.exe
            dist/DPort-WiFi-Test-6.9.1.exe.sha256
          retention-days: 14
