name: DPort Windows WiFi Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_dport_windows_wifi_691_fix5.py'
      - '.github/workflows/dport-windows-wifi-test.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build DPort 6.9.1 WiFi FIX5
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Build from clean v6.9.1 release source
        shell: pwsh
        run: |
          python .\scripts\build_dport_windows_wifi_691_fix5.py

      - name: Upload clean test files
        uses: actions/upload-artifact@v4
        with:
          name: DPort-WiFi-Test-6.9.1-FIX5
          path: DPort-WiFi-Test-6.9.1
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
